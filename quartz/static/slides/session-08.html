# Патефон, который нельзя построить

**«Гёдель, Эшер, Бах»**

Диалог «Акростиконтрапунктус» · Глава IV

---

## Загадка

Идеальный патефон Краба играет **любой** звук.

Черепаха приносит пластинку:
**«Меня нельзя воспроизвести на патефоне X»**

```
  ╭──────────────╮   ♪ ♫ ♪
  │  (◉)   ══╗   │ ◀ резонанс
  ╰──────────────╯
     ✶ ╲ │ ╱ ✶    т р е с к
```

---

## Выбор Краба

```
             патефон X
          ┌──────┴──────┐
     играет всё    играет не всё
          │             │
    ✶ разбит ✶    цел, но не Идеален
```

---

## «Омега»

Патефон перестраивает себя перед игрой.

Но перестроенный патефон — просто **новый** патефон X′.

Для него найдётся своя песня.

---

## B — A — C — H

```
  B = си-бемоль    A = ля
  C = до           H = си

  ─────────────●──────────
  ──●─────────────────────
  ───────●────────────────
  ─────────────────────●──  ← H
     B     A     C     H
```

Имя Баха — тема его последней, **неоконченной** фуги.

---

## Бокал

На ноте H бокал Баха разбивается.

Вещь, на которой написана музыка,
гибнет от музыки, которая на ней написана.

*Смерть Баха «на своём имени» — скорее легенда.*

---

## Текст, который говорит о себе

```
  Х …  ┃
  О …  ┃  «Хофштадтеровский
  Ф …  ┃   Акростиконтрапунктус…»
  Ш …  ▼
```

**[ вопрос залу ]** О чём текст?
А о чём он, если читать только первые буквы?

---

## Два уровня

У пластинки:

1. **звук**, который слышит Краб;
2. **вибрации** самого патефона.

Пластинка «говорит» о патефоне, на котором играет.

---

## 1 · Игра по правилам

| Слово | Аналогия |
|---|---|
| формальная система | игра со значками |
| аксиома | начальная расстановка фигур |
| правило вывода | разрешённый ход |
| теорема | позиция, до которой можно доиграть |
| интерпретация | словарь смыслов |

---

## Пр-система

```
  строчка      «р» = равно
  --п-р---     2 + 1 = 3   ✓
  --п-р--      2 + 1 = 2   ✗  ← новая аксиома
```

Система «соврала»?

---

## Строчки не умеют врать

```
  строчка      «р» = больше или равно
  --п-р---     2 + 1 ≥ 3   ✓
  --п-р--      2 + 1 ≥ 2   ✓
```

Ни один значок не изменился. Противоречие исчезло.

**Непротиворечивость** — свойство системы *вместе с прочтением*.

---

## Три стрелки

```
          Черепаха
         ↗        ↘
    Эгберт ◀──── Зенон
```

| «→» значит | |
|---|---|
| «всегда обыгрывает» | камень–ножницы–бумага ✓ |
| «изобрёл» | Черепаха старше себя ✗ |

---

## Рисующие руки

Эшер: каждая рука рисует другую.

Противоречие с «изобрёл» — не логическое:
оно из нашего знания о **времени**.

**[ вопрос залу ]** Третье прочтение стрелки — безобидное?
Четвёртое — невозможное?

---

## Пьер Менар, автор «Дон Кихота»

```
  Сервантес        Менар
  те же слова  ≡   те же слова
       ▼               ▼
  один смысл   ≠   другой смысл
```

Смысл возникает **в сцепке текста с прочтением**.

---

## 2 · Пять постулатов

1. Через две точки — прямая.
2. Отрезок можно продолжать.
3. Из любой точки — окружность.
4. Все прямые углы равны.
5. Если сумма внутренних углов с одной стороны меньше двух прямых, прямые **рано или поздно встретятся**.

---

## Пятый постулат

```
  a ─────────────────── ⋯ ✕
        ╲ α          ⋰
  b ─────╲──────  ⋰
          ╲ β
   α + β < 180°  ⇒  встретятся
```

*Гадкий утёнок: длинный и уводит взгляд за край листа.*

---

## Попытки доказать

```
  ок. 300 до н. э.  Евклид
  античность        Птолемей, Прокл
  XI–XII вв.        Омар Хайям
  1733              Саккери
  ок. 1766          Ламберт
```

Каждый раз «доказательство» опиралось
на тот же постулат в другой одежде.

---

## Прорыв

```
  Гаусс          знает, но молчит
  1826 / 1829    Лобачевский
  1832           Больаи
  1854           Риман
  1868           Бельтрами
```

**Пятый постулат независим.**

Больаи: «из ничего — новый, иной мир».

---

## Слова без словаря

«Точка» и «прямая» значат только то,
что о них сказано в постулатах.

Гильберт (в пересказе): можно говорить
«столы, стулья и пивные кружки».

Иван Карамазов: ум «эвклидовский, земной».

---

## Треугольник на апельсине

```
          ● полюс  90°
         ╱│╲
        ╱ │ ╲
     ──●──┼──●──  экватор
      90°    90°
```

**90° + 90° + 90° = 270° > 180°**

---

## Прямые на шаре

«Прямая» = **большой круг**:
экватор, меридианы, маршрут самолёта.

Два больших круга **всегда** пересекаются.
Параллельных нет.

**[ эксперимент ]** Проведите на апельсине
две «прямые», которые не встретятся.

---

## Три геометрии

| | сфера | плоскость | Лобачевский |
|---|---|---|---|
| параллельных | нет | одна | много |
| сумма углов | > 180° | = 180° | < 180° |

Эшер, «Предел — круг»: карта мира Лобачевского.

> Пятый постулат — **выбор мира**, а не следствие правил.

---

## 3 · Возможные миры

```
  □ необходимо = истинно во всех мирах
  ◇ возможно   = истинно хотя бы в одном
```

Наполеон проиграл при Ватерлоо — **не необходимо**.

Холостяк не женат — **необходимо**.

---

## Мир для системы

**Хофштадтер:** система непротиворечива,
если можно вообразить мир,
где **все её теоремы истинны**.

Пр-система → мир «больше или равно».

Геометрия без 5-го постулата → мир сферы.

---

## Внутри и снаружи

```
   ↓ ⌂     ← ⌂     ↑ ⌂
   три силы тяжести в одном доме
```

Эшер, «Относительность».

**Внутренняя** непротиворечивость: правила не спорят с собой.

**Внешняя**: правила согласны с *нашим* миром.

---

## Как далеко можно зайти?

```
  говорящая Черепаха     ✓
  животные не из клеток  ?
  другая физика          ?
  квадратный круг        ✗
  7 делится на 3         … тишина
```

**[ вопрос залу ]** Голосуем по строчкам.

---

## Тлён

Борхес, «Тлён, Укбар, Orbis Tertius».

Насколько можно расшатать мир,
прежде чем он перестанет быть понятным?

Логика и числа — общие для всех миров?

---

## 4 · Теория чисел

Простые числа — **буквы**, из которых пишутся числа:

```
  6  = 2 · 3
  12 = 2 · 2 · 3
  30 = 2 · 3 · 5
```

Другого «написания» нет.

---

## Гольдбах, 1742

Каждое чётное больше двух — сумма двух простых.

```
  4 = 2 + 2      8 = 3 + 5
  6 = 3 + 3     10 = 5 + 5
  ⋮   проверено до ~ 4·10¹⁸
  ∞   доказательства нет
```

---

## Евклид: простых бесконечно много

```
  «полный список»   2, 3, 5
  2 · 3 · 5 + 1  =  31
```

31 не делится ни на одно число из списка
⇒ есть простое, которого в списке нет.

---

## Проверим

**[ вопрос залу ]** Список 2, 3, 5, 7, 11, 13:

```
  30 030 + 1 = 30 031 = 59 · 509
```

59 и 509 — не в списке.

> Какой список ни принеси, найдётся число,
> которое в него не влезает.

---

## Истинное и выводимое

```
 ╭───── всё истинное ──────────╮
 │ ╭── всё выводимое ──╮   ★   │
 │ │  2 + 2 = 4        │ «меня │
 │ ╰───────────────────╯ нельзя│
 │                    вывести» │
 ╰─────────────────────────────╯
```

---

## Аксиомы Пеано, 1889

1. Ноль — число.
2. У каждого числа есть следующее.
3. Ноль ни за чем не следует.
4. У разных чисел — разные следующие.
5. **Принцип домино.**

**Полнота:** всё истинное — выводимо.

---

## 5 · Зачем это было нужно

```
  1900  Гильберт: докажем непротиворечивость
  1902  Рассел → Фреге: противоречие
  1930  «Мы должны знать — мы будем знать»
  1931  Гёдель, 24 года
```

Из противоречия выводится **всё**.

---

## Шаг первый: числа говорят о себе

```
  значок   →  номер
  строчка  →  число
  правило  →  операция над числами
```

«Число N обладает свойством…»
=
«Строчка №N — теорема».

Как акростих.

---

## Шаг второй

> **«Меня нельзя вывести в системе X»**

Это песня Черепахи,
настроенная на конкретную систему.

---

## Выводит ли X эту строчку?

```
          ┌────┴────┐
         ДА        НЕТ
          │          │
  доказала ложь   говорит правду:
          │       истинна
  ✶ разбита ✶     и невыводима
```

---

## Теорема

**Если система достаточно сильна для арифметики
и не выводит ложь,**

**в ней есть истинное утверждение,
которое она не может доказать.**

---

## Патефоны ↔ системы (1)

| Диалог | Логика |
|---|---|
| патефон | формальная система |
| Идеальный | полная |
| пластинка | строчка |
| можно сыграть | теорема |
| звук | истинное утверждение |

---

## Патефоны ↔ системы (2)

| Диалог | Логика |
|---|---|
| песня «нельзя воспроизвести» | «нельзя вывести» |
| вибрации корпуса | второй уровень смысла |
| патефон разбит | система вывела ложь |
| «Омега» | новые аксиомы |

---

## Почему это не Лжец

```
  «Это утверждение ложно»
   истинно → ложно → истинно ⟲   ПАРАДОКС

  «Это утверждение недоказуемо»
   истинно → недоказуемо → ну и что?
```

**[ вопрос залу ]** Минута спора.

---

## Одно слово

Гёдель взял Эпименида и заменил **одно слово**:

«ложно» → «невыводимо».

Магритт: «Это не трубка».

Сервантес: герои второго тома читали первый.

---

## «Омега» не поможет

```
  X              песня G
  X′ = X  + G    песня G′
  X″ = X′ + G′   песня G″
  ⋮               ⋮
```

**Существенная неполнота:** свойство всех таких систем сразу.

---

## Вторая теорема

Непротиворечивая система **не может доказать
свою непротиворечивость** своими средствами.

«Верьте мне, я никогда не вру!» —
лжец сказал бы то же самое.

Генцен (1936): доказал — но **более сильными** средствами.

---

## Три условия

1. аксиомы и ходы проверяются механически;
2. выразимы **сложение и умножение**;
3. система непротиворечива.

```
  геометрия (Тарский)         полна
  без умножения (Пресбургер)  полна
  арифметика Пеано            неполна
```

---

## Неполнота — плата за силу

Плохой патефон
слишком тугоух,
чтобы разбиться.

---

## Заблуждение 1

**✗ «Всё относительно,
математика ничего не знает»**

Теорема — строгое знание.

Она даже говорит, что G **истинна**.

---

## Заблуждение 2

**✗ «Это применимо к праву,
религии, литературе»**

Только к формальным системам с арифметикой.

Метафора ≠ доказательство.

---

## Заблуждение 3

**✗ «Человек превосходит любую машину»**
(Лукас, Пенроуз)

Истинность G видна, только если знаем
о непротиворечивости.

Хофштадтер спорит. Теорема вопроса не решает.

---

## Сборка

```
        ┌┴┐      X‴
       ┌┴─┴┐     X″
      ┌┴───┴┐    X′
     ┌┴─────┴┐   X
```

У башни **нет верхнего этажа**.

---

## Три мысли

1. Значки сами по себе ничего не значат.
2. Сильная система неизбежно говорит о себе.
3. Выбор Краба: **разбиться или остаться неполной**.

---

## На ноте H

```
   B    A    C    H
   ♪    ♪    ♪   ╲│╱
                ✶ ✶ ✶
```

Самоссылка даёт системе силу —
и она же оставляет её незавершённой.

*Связь поэтическая, не логическая.*

---

а что — **уцелевший плохой патефон**?
